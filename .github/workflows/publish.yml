name: Update foliage data and publish map
on:
  push:
    branches: [main]
  schedule:
    # Once every three hours in the autumn (UTC; minutes staggered).
    - cron: '17 */3 * 9-12 *'
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled]

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: koyo-live-pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'verified') || (github.event.action == 'unlabeled' && github.event.label.name == 'verified')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Expand verified-coordinate sightseeing candidates once
        run: python scripts/import_spots.py
      - name: Validate expanded catalog
        run: python -m unittest discover -s tests -v
      - name: Get latest observations (respect robots.txt)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_data.py
      - name: Refresh offline fallback inside HTML
        run: python scripts/build_embedded.py
      - name: Commit data snapshots without blocking deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/spots.json data/catalog-import.done index.html
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh observed foliage snapshots"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Data snapshot saved to main"
                exit 0
              fi
              git rebase --abort || true
              echo "::warning::Snapshot push conflict on attempt ${attempt}; retrying"
              sleep 2
            done
            echo "::warning::Snapshot push skipped after retries; continuing Pages deployment"
          fi
      - name: Publish v1.0.0 GitHub Release
        continue-on-error: true
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 --title "KOYO LIVE v1.0.0" --notes-file CHANGELOG.md --target "$GITHUB_SHA"
          fi
      - name: Publish nationwide v1.1.0 release
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.1.0 >/dev/null 2>&1; then
            gh release create v1.1.0 --title "KOYO LIVE v1.1.0 | Nationwide map" --notes-file CHANGELOG.md --target "$GITHUB_SHA"
          fi
      - name: Prepare static site
        run: |
          mkdir -p dist/assets dist/data
          cp index.html .nojekyll dist/
          cp assets/* dist/assets/
          cp data/spots.json data/live.json dist/data/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
