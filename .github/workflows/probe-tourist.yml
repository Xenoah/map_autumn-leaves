name: Probe foliage-friendly open tourism geodata
on:
  push:
    paths:
      - .github/workflows/probe-tourist.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect CSV schema and foliage candidates
        run: |
          python - <<'PY'
          import csv,io,urllib.request,collections
          url='https://raw.githubusercontent.com/rtcode337/travel-log-data/main/tourist/spots.csv'
          req=urllib.request.Request(url,headers={'User-Agent':'KOYO-LIVE-open-geodata-research/1.0 (+https://github.com/Xenoah/map_autumn-leaves)'})
          with urllib.request.urlopen(req,timeout=40) as r:
              content=r.read().decode('utf-8-sig')
          reader=csv.DictReader(io.StringIO(content))
          print('FIELDS:',reader.fieldnames)
          rows=list(reader)
          print('TOTAL:',len(rows))
          for row in rows[:5]: print('SAMPLE:',str(row)[:900])
          by_col=collections.Counter()
          for row in rows:
              for col,val in row.items():
                  if val and any(k in val for k in ('紅葉','もみじ','モミジ','楓','カエデ','黄葉','イチョウ','銀杏')):
                      by_col[col]+=1
          print('FOILAGE_KEYWORD_COUNTS:',dict(by_col))
          print('SERIES_COUNTS:',dict(collections.Counter(x['series'] for x in rows).most_common()))
          print('RANK_COUNTS:',dict(collections.Counter(x['rank'] for x in rows).most_common()))
          print('SERIES_RANK_TABLE:',{series:dict(collections.Counter(x['rank'] for x in rows if x['series']==series)) for series in ('公園','庭園','自然','渓谷','滝','山','湖','景勝地','寺院','神社','寺社','城','城跡','温泉')})
          print('PUBLIC_PARKS_SAMPLE:',[(x['name'],x['series'],x['rank']) for x in rows if x['series'] in ('公園','庭園')][:45])
          print('EXAMPLES:')
          n=0
          for row in rows:
              if any(k in str(row) for k in ('紅葉','もみじ','モミジ','黄葉')):
                  print({key:(value[:130] if isinstance(value,str) else value) for key,value in row.items() if key in ('name','description','summary','region','prefecture','rank','lat','lon','latitude','longitude','categories')})
                  n+=1
                  if n==12: break
          PY
